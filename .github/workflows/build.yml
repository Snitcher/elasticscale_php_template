name: Build & push Laravel images to ECR

on:
  push:
    branches: [ staging, main ]
  workflow_dispatch: {}

env:
  AWS_REGION: eu-central-1

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      id-token: write   # for OIDC
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Decide role and repos based on branch
      - name: Set deployment config from branch
        id: cfg
        run: |
          echo "Branch: ${GITHUB_REF_NAME}"

          if [ "${GITHUB_REF_NAME}" = "staging" ]; then
            ROLE_ARN="arn:aws:iam::109880550199:role/snitcher-staging-github"
            NGINX_REPO="snitcher-staging-nginx"
            PHP_REPO="snitcher-staging-php"
          elif [ "${GITHUB_REF_NAME}" = "main" ]; then
            ROLE_ARN="arn:aws:iam::109880550199:role/snitcher-prod-github"
            NGINX_REPO="snitcher-prod-nginx"
            PHP_REPO="snitcher-prod-php"
          else
            echo "Unsupported branch: ${GITHUB_REF_NAME}"
            exit 1
          fi

          SHORT_SHA="${GITHUB_SHA::7}"

          echo "Using role: ${ROLE_ARN}"
          echo "Using nginx repo: ${NGINX_REPO}"
          echo "Using php repo: ${PHP_REPO}"
          echo "Using sha tag: ${SHORT_SHA}"

          echo "role_arn=${ROLE_ARN}" >> $GITHUB_OUTPUT
          echo "nginx_repo=${NGINX_REPO}" >> $GITHUB_OUTPUT
          echo "php_repo=${PHP_REPO}" >> $GITHUB_OUTPUT
          echo "sha_tag=${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.cfg.outputs.role_arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build & push nginx image with two tags: <sha> and latest
      - name: Build and push nginx image
        working-directory: ./laravel
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY_NGINX: ${{ steps.cfg.outputs.nginx_repo }}
          SHA_TAG: ${{ steps.cfg.outputs.sha_tag }}
        run: |
          docker build \
            -f .infra/Dockerfile.nginx \
            -t ${ECR_REGISTRY}/${ECR_REPOSITORY_NGINX}:${SHA_TAG} \
            -t ${ECR_REGISTRY}/${ECR_REPOSITORY_NGINX}:latest \
            .
          docker push ${ECR_REGISTRY}/${ECR_REPOSITORY_NGINX}:${SHA_TAG}
          docker push ${ECR_REGISTRY}/${ECR_REPOSITORY_NGINX}:latest

      # Build & push php image with two tags: <sha> and latest
      - name: Build and push php image
        working-directory: ./laravel
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY_PHP: ${{ steps.cfg.outputs.php_repo }}
          SHA_TAG: ${{ steps.cfg.outputs.sha_tag }}
        run: |
          docker build \
            -f .infra/Dockerfile.php-fpm \
            -t ${ECR_REGISTRY}/${ECR_REPOSITORY_PHP}:${SHA_TAG} \
            -t ${ECR_REGISTRY}/${ECR_REPOSITORY_PHP}:latest \
            .
          docker push ${ECR_REGISTRY}/${ECR_REPOSITORY_PHP}:${SHA_TAG}
          docker push ${ECR_REGISTRY}/${ECR_REPOSITORY_PHP}:latest
